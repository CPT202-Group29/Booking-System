<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slot Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <h2>Booking Admin</h2>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="specialist-management.html">Specialists</a>
        <a href="booking-management.html">Bookings</a>
        <a class="active" href="slot-management.html">Time Slots</a>
        <a href="expertise-management.html">Expertise</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <h1>Manage Time Slots</h1>
      </header>

      <section class="panel" id="slotFormPanel">
        <div class="panel-header">
          <h2>Create New Slot</h2>
        </div>

        <form id="slotForm" class="specialist-form">
          <div class="form-grid">
            <div class="form-group">
              <label for="specialistId">Specialist ID</label>
              <input type="number" id="specialistId" required />
            </div>
            <div class="form-group">
              <label for="startTime">Start Time</label>
              <input type="datetime-local" id="startTime" required />
            </div>
            <div class="form-group">
              <label for="endTime">End Time</label>
              <input type="datetime-local" id="endTime" required />
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary-btn" id="submitBtn">Save Slot</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script src="slot-management.js"></script>
</body>
</html>
