<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expertise Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <h2>Booking Admin</h2>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="specialist-management.html">Specialists</a>
        <a href="booking-management.html">Bookings</a>
        <a href="slot-management.html">Time Slots</a>
        <a class="active" href="expertise-management.html">Expertise</a>
        <a href="#">Reports</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>Expertise Management</h1>
          <p>Manage expertise categories for specialists.</p>
        </div>
        <button class="primary-btn" id="showFormBtn">Add Expertise</button>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>Expertise Categories</h2>
          <select id="expertiseStatusFilter">
            <option value="All">All Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th>Status</th>
              <th>Used By</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expertiseTableBody"></tbody>
        </table>
      </section>

      <section class="panel" id="expertiseFormSection" style="display:none;">
        <div class="panel-header">
          <h2 id="formTitle">Add Expertise Category</h2>
        </div>
        <form id="expertiseForm">
          <input type="hidden" id="editIndex" value="" />
          <div class="form-group">
            <label for="expertiseName">Name</label>
            <input type="text" id="expertiseName" required />
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
          <div class="form-group">
            <label for="usedBy">Used By (number of specialists)</label>
            <input type="number" id="usedBy" value="0" min="0" />
          </div>
          <div class="form-actions">
            <button type="submit" class="primary-btn" id="submitBtn">Save Expertise</button>
            <button type="button" class="secondary-btn" id="resetBtn">Clear Form</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="expertise-management.js"></script>
</body>
</html>
