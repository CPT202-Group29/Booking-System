<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Expert Booking System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Fira Sans', Arial, sans-serif;
            background: #F7F5F2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .reset-card {
            background: #fff;
            padding: 40px 36px;
            border-radius: 22px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03), 0 8px 32px rgba(0,0,0,0.03);
            width: 100%;
            max-width: 440px;
        }
        .reset-card h2 {
            text-align: center;
            margin-bottom: 28px;
            color: #3D3D3D;
            font-size: 22px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #8B8378;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #EDE8E0;
            border-radius: 14px;
            font-size: 14px;
            font-family: inherit;
            background: #FAF8F5;
            color: #4A4A4A;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #D4C4B0;
            box-shadow: 0 0 0 4px rgba(200,180,155,0.12);
            background: #fff;
        }
        .verification-row { display: flex; gap: 10px; }
        .verification-row input { flex: 1; }
        .verification-row button {
            white-space: nowrap;
            padding: 0 16px;
            background: #E8B4A2;
            color: #fff;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.25s ease;
        }
        .verification-row button:hover { background: #E0A18A; }
        .btn-reset {
            width: 100%;
            padding: 12px;
            background: #E8B4A2;
            color: #fff;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.25s ease;
        }
        .btn-reset:hover { background: #E0A18A; }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #d1fae5; color: #065f46; }
        .reset-card p {
            text-align: center;
            margin-top: 15px;
            color: #6b7280;
            font-size: 0.9rem;
        }
        .reset-card p a { color: #3b82f6; text-decoration: none; font-weight: 500; }
        .reset-card p a:hover { text-decoration: underline; }
        small { display: block; margin-top: 4px; font-size: 0.8rem; color: #6b7280; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2>Reset Password</h2>
        <form id="forgotForm">
            <div class="form-group">
                <label>Registered Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Verification Code</label>
                <div class="verification-row">
                    <input type="text" id="verificationCode" required placeholder="6-digit code">
                    <button type="button" id="sendCodeBtn">Send Code</button>
                </div>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required>
                <small>At least 6 characters, include letters and numbers</small>
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn-reset">Reset Password</button>
        </form>
        <div id="message" class="message"></div>
        <p><a href="login.html">Back to Login</a></p>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
