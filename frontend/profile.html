<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人资料</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>个人资料</h2>
        <div id="profileView">
            <div style="text-align:center">
                <img id="avatarImg" class="avatar-preview" src="" alt="头像">
            </div>
            <p><strong>姓名：</strong> <span id="displayName"></span></p>
            <p><strong>邮箱：</strong> <span id="displayEmail"></span> (不可修改)</p>
            <p><strong>电话：</strong> <span id="displayPhone"></span></p>
            <button id="editBtn">编辑资料</button>
            <button id="changePwdBtn">修改密码</button>
            <button id="deleteAccountBtn" style="background:#dc3545;">删除账户</button>
            <button id="logoutBtn" style="background:#6c757d;">登出</button>
        </div>
        <div id="editForm" style="display:none;">
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>电话</label>
                <input type="text" id="editPhone">
            </div>
            <div class="form-group">
                <label>上传头像</label>
                <input type="file" id="avatarFile" accept="image/jpeg,image/png">
            </div>
            <button id="saveBtn">保存</button>
            <button id="cancelBtn">取消</button>
        </div>
        <div id="changePwdForm" style="display:none;">
            <div class="form-group">
                <label>旧密码</label>
                <input type="password" id="oldPassword">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPassword">
                <small>至少6位，包含字母和数字</small>
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirmNewPassword">
            </div>
            <button id="submitPwdBtn">确认修改</button>
            <button id="cancelPwdBtn">取消</button>
        </div>
        <div id="message" class="message"></div>
    </div>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
