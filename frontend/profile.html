<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>My Profile</h2>
        <div id="profileView">
            <img id="avatarImg" src="" alt="Avatar" style="width:100px; border-radius:50%;">
            <p><strong>Name:</strong> <span id="displayName"></span></p>
            <p><strong>Phone:</strong> <span id="displayPhone"></span></p>
            <p><strong>Username:</strong> <span id="displayUsername"></span></p>
            <p><strong>Role:</strong> <span id="displayRole"></span></p>
            <button id="editBtn">Edit Profile</button>
            <button id="changePwdBtn">Change Password</button>
            <button id="deleteAccountBtn">Delete Account</button>
            <button id="logoutBtn">Logout</button>
        </div>
        <div id="editForm" style="display:none;">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="editPhone">
            </div>
            <div class="form-group">
                <label>Avatar</label>
                <input type="file" id="avatarFile" accept="image/jpeg,image/png">
            </div>
            <button id="saveBtn">Save</button>
            <button id="cancelBtn">Cancel</button>
        </div>
        <div id="changePwdForm" style="display:none;">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <button id="submitPwdBtn">Update Password</button>
            <button id="cancelPwdBtn">Cancel</button>
        </div>
        <div id="message" class="message"></div>
        <div class="nav-links">
            <a href="specialist-list.html">specialist-list.html</a> |
            <a href="my-bookings.html">My Bookings</a>
        </div>
    </div>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
