<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>My Profile</h2>
        <div id="profileView">
            <div style="text-align:center">
                <img id="avatarImg" class="avatar-preview" src="" alt="Avatar">
            </div>
            <p><strong>Name:</strong> <span id="displayName"></span></p>
            <p><strong>Email:</strong> <span id="displayEmail"></span> (read-only)</p>
            <p><strong>Phone:</strong> <span id="displayPhone"></span></p>
            <button id="editBtn">Edit Profile</button>
            <button id="changePwdBtn">Change Password</button>
            <button id="deleteAccountBtn" style="background:#dc3545;">Delete Account</button>
            <button id="logoutBtn" style="background:#6c757d;">Logout</button>
        </div>
        <div id="editForm" style="display:none;">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="editPhone">
            </div>
            <div class="form-group">
                <label>Upload Avatar</label>
                <input type="file" id="avatarFile" accept="image/jpeg,image/png">
            </div>
            <button id="saveBtn">Save</button>
            <button id="cancelBtn">Cancel</button>
        </div>
        <div id="changePwdForm" style="display:none;">
            <div class="form-group">
                <label>Old Password</label>
                <input type="password" id="oldPassword">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword">
                <small>At least 6 characters, include letters and numbers</small>
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmNewPassword">
            </div>
            <button id="submitPwdBtn">Confirm Change</button>
            <button id="cancelPwdBtn">Cancel</button>
        </div>
        <div id="message" class="message"></div>
    </div>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
