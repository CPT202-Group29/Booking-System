<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .status-PENDING { color: #f0ad4e; font-weight: bold; }
        .status-CONFIRMED { color: #5bc0de; font-weight: bold; }
        .status-COMPLETED { color: #5cb85c; font-weight: bold; }
        .status-CANCELLED { color: #d9534f; font-weight: bold; }
        .status-EXPIRED { color: #999; font-weight: bold; }
        .booking-card {
            border: 1px solid #ddd;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            background: #fafafa;
        }
        .btn-cancel {
            background: #d9534f;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 10px;
        }
        .btn-reschedule {
            background: #f0ad4e;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        /* 改期模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index:1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-top:0; }
        .modal-actions { margin-top: 15px; text-align: right; }
        .modal-actions button { margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Bookings</h2>
        <div id="bookingsList">Loading...</div>
        <div class="nav-links">
            <a href="specialist-list.html">Find a Specialist</a> |
            <a href="profile.html">My Profile</a> |
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </div>

    <!-- 改期模态框 -->
    <div class="modal-overlay" id="rescheduleModal">
        <div class="modal-content">
            <h3>Select New Time Slot</h3>
            <div id="rescheduleSlotList">Loading available slots...</div>
            <div class="modal-actions">
                <button onclick="document.getElementById('rescheduleModal').style.display='none'">Cancel</button>
                <button id="confirmRescheduleBtn" class="btn-reschedule">Confirm Reschedule</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/my-bookings.js"></script>
</body>
</html>
