<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; margin: 0; font-family: 'Fira Sans', Arial, sans-serif; }
        .sidebar { width: 240px; background: linear-gradient(180deg, #EFE8DE 0%, #E8DFD3 100%); color: #5C5C5C; padding: 28px 18px; border-right: 1px solid #DDD4C5; }
        .sidebar h2 { color: #3D3D3D; text-align: center; margin-bottom: 28px; font-size: 20px; font-weight: 700; border-bottom: 1px solid #DDD4C5; padding-bottom: 16px; }
        .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
        .sidebar nav a { color: #8B8378; text-decoration: none; padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; transition: all 0.25s ease; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #F0EBE3; color: #3D3D3D; border-left: none; }
        .sidebar nav a.active { background: #E8DFD3; font-weight: 600; }
        .main { flex: 1; background: #F7F5F2; padding: 36px 40px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 32px 36px; border-radius: 22px; box-shadow: 0 2px 12px rgba(0,0,0,0.03), 0 8px 32px rgba(0,0,0,0.03); }
        .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid #EDE8E0; }
        .tabs button { padding: 10px 20px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; color: #A09888; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.25s ease; }
        .tabs button.active { color: #C4A88B; border-bottom-color: #C4A88B; font-weight: 600; }
        .booking-card { border: 1px solid #EDE8E0; padding: 18px 24px; margin-bottom: 12px; border-radius: 18px; background: #FAF8F5; cursor: pointer; transition: box-shadow 0.25s ease; }
        .booking-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
        .status-PENDING { color: #B8820C; font-weight: 600; }
        .status-CONFIRMED { color: #3A5A7C; font-weight: 600; }
        .status-COMPLETED { color: #3D6B35; font-weight: 600; }
        .status-CANCELLED { color: #8A4040; font-weight: 600; }
        .status-EXPIRED { color: #A09888; font-weight: 600; }
        .btn-cancel { background: #F0D5D5; color: #8A4040; border: none; padding: 6px 14px; border-radius: 40px; cursor: pointer; margin-right: 8px; font-family: inherit; font-size: 12px; font-weight: 600; transition: all 0.25s ease; }
        .btn-cancel:hover { background: #E0C0C0; }
        .btn-reschedule { background: #FCE8D5; color: #8B6914; border: none; padding: 6px 14px; border-radius: 40px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; transition: all 0.25s ease; }
        .btn-reschedule:hover { background: #F8D8B5; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
        .pagination button { padding: 8px 14px; border: 1.5px solid #EDE8E0; background: #fff; cursor: pointer; border-radius: 12px; font-family: inherit; font-size: 13px; color: #5C5C5C; transition: all 0.25s ease; }
        .pagination button.active { background: #E8B4A2; color: #fff; border-color: #E8B4A2; }
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); justify-content: center; align-items: center; z-index:1000; }
        .modal-content { background: #fff; padding: 28px; border-radius: 22px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-top:0; color: #3D3D3D; }
        .modal-close { float: right; background: none; border: none; font-size: 22px; cursor: pointer; color: #A09888; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Expert Booking</h2>
        <nav>
            <a href="profile.html">My Profile</a>
            <a href="specialist-list.html">Find a Specialist</a>
            <a href="my-bookings.html" class="active">My Bookings</a>
            <a href="#" onclick="localStorage.clear();location.href='login.html'" style="margin-top:auto;border-top:1px solid #334155;padding-top:15px;margin-top:20px;">Logout</a>
        </nav>
    </aside>
    <main class="main">
        <div class="container">
            <h2 style="margin-top:0;">My Bookings</h2>
            <div class="tabs">
                <button id="tabUpcoming" class="active">Upcoming</button>
                <button id="tabHistory">History</button>
            </div>
            <div id="bookingsList">Loading...</div>
            <div class="pagination" id="pagination"></div>
        </div>
    </main>
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('detailModal').style.display='none'">&times;</button>
            <h3>Booking Detail</h3>
            <div id="detailContent"></div>
        </div>
    </div>
    <script type="module" src="js/my-bookings.js"></script>
</body>
</html>
