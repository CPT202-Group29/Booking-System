<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .status-PENDING { color: #f0ad4e; font-weight: bold; }
        .status-CONFIRMED { color: #5bc0de; font-weight: bold; }
        .status-COMPLETED { color: #5cb85c; font-weight: bold; }
        .status-CANCELLED { color: #d9534f; font-weight: bold; }
        .status-EXPIRED { color: #999; font-weight: bold; }
        .booking-card {
            border: 1px solid #ddd;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            background: #fafafa;
            cursor: pointer;
        }
        .booking-card:hover { background: #f0f0f0; }
        .btn-cancel {
            background: #d9534f;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 10px;
        }
        .btn-reschedule {
            background: #f0ad4e;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tabs button {
            padding: 8px 16px;
            border: none;
            background: #eee;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
        }
        .tabs button.active {
            background: #007bff;
            color: white;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }
        .pagination button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .pagination button.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 详情模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index:1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-top:0; }
        .modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Bookings</h2>
        <div class="tabs">
            <button id="tabUpcoming" class="active">Upcoming</button>
            <button id="tabHistory">History</button>
        </div>
        <div id="bookingsList">Loading...</div>
        <div class="pagination" id="pagination"></div>
        <div class="nav-links">
            <a href="specialist-list.html">Find a Specialist</a> |
            <a href="profile.html">My Profile</a> |
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('detailModal').style.display='none'">&times;</button>
            <h3>Booking Detail</h3>
            <div id="detailContent"></div>
        </div>
    </div>

    <script type="module" src="js/my-bookings.js"></script>
</body>
</html>
