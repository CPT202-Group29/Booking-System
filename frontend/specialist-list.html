<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Specialist</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .search-bar input, .search-bar select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            flex: 1;
            min-width: 100px;
        }
        .search-bar button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .search-bar label {
            display: block;
            font-size: 0.8em;
            color: #666;
            margin-bottom: 2px;
        }
        .specialist-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #fafafa;
        }
        .specialist-card h3 { margin: 0 0 10px 0; }
        .specialist-card p { margin: 5px 0; }
        .badge-available { color: green; font-weight: bold; }
        .badge-unavailable { color: red; font-weight: bold; }
        .view-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Find a Specialist</h2>
        <div class="search-bar">
            <div>
                <label>Name</label>
                <input type="text" id="searchName" placeholder="Search by name...">
            </div>
            <div>
                <label>Expertise</label>
                <select id="searchExpertise"><option value="">All</option></select>
            </div>
            <div>
                <label>Level</label>
                <select id="searchLevel">
                    <option value="">All</option>
                    <option value="Junior">Junior</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Senior">Senior</option>
                </select>
            </div>
            <div>
                <label>Status</label>
                <select id="searchStatus">
                    <option value="">All</option>
                    <option value="1">Available</option>
                    <option value="0">Unavailable</option>
                </select>
            </div>
            <div>
                <label>Min Fee</label>
                <input type="number" id="searchMinFee" placeholder="0" min="0" style="width:80px;">
            </div>
            <div>
                <label>Max Fee</label>
                <input type="number" id="searchMaxFee" placeholder="999" min="0" style="width:80px;">
            </div>
            <button id="searchBtn">Search</button>
            <button id="clearBtn" style="background:#6c757d;">Clear All</button>
        </div>
        <div id="specialistList">Loading specialists...</div>
    </div>

    <script type="module">
        const API_BASE = 'http://121.196.221.244:8080';

        async function loadSpecialists(filters = {}) {
            const params = new URLSearchParams();
            if (filters.name) params.append('name', filters.name);
            if (filters.expertise) params.append('expertise', filters.expertise);
            if (filters.level) params.append('level', filters.level);
            if (filters.status !== undefined && filters.status !== '') params.append('status', filters.status);
            if (filters.minFee) params.append('minFee', filters.minFee);
            if (filters.maxFee) params.append('maxFee', filters.maxFee);

            try {
                const response = await fetch(`${API_BASE}/api/v1/specialists?${params.toString()}`);
                if (!response.ok) throw new Error('Failed to fetch specialists');
                const specialists = await response.json();
                renderSpecialists(specialists);
            } catch (err) {
                document.getElementById('specialistList').innerHTML = `<p class="error">Failed to load specialists: ${err.message}</p>`;
            }
        }

        function renderSpecialists(specialists) {
            const container = document.getElementById('specialistList');
            if (specialists.length === 0) {
                container.innerHTML = '<p>No specialists found.</p>';
                return;
            }
            container.innerHTML = specialists.map(s => {
                const statusText = s.statusText || (s.status === 1 ? 'Available' : 'Unavailable');
                const statusClass = s.status === 1 ? 'badge-available' : 'badge-unavailable';
                return `
                    <div class="specialist-card">
                        <h3>${s.name}</h3>
                        <p><strong>Expertise:</strong> ${s.expertise}</p>
                        <p><strong>Level:</strong> ${s.level}</p>
                        <p><strong>Fee:</strong> $${s.fee}/hour</p>
                        <p><strong>Status:</strong> <span class="${statusClass}">${statusText}</span></p>
                        <a href="specialist-details.html?id=${s.id}" class="view-btn">View & Book</a>
                    </div>
                `;
            }).join('');
        }

        async function loadExpertiseOptions() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/expertise`);
                if (!response.ok) return;
                const expertiseList = await response.json();
                const select = document.getElementById('searchExpertise');
                expertiseList.forEach(exp => {
                    const option = document.createElement('option');
                    option.value = exp.expertiseName;
                    option.textContent = exp.expertiseName;
                    select.appendChild(option);
                });
            } catch (err) { console.error('Failed to load expertise:', err); }
        }

        document.getElementById('searchBtn').addEventListener('click', () => {
            const filters = {
                name: document.getElementById('searchName').value.trim(),
                expertise: document.getElementById('searchExpertise').value,
                level: document.getElementById('searchLevel').value,
                status: document.getElementById('searchStatus').value,
                minFee: document.getElementById('searchMinFee').value,
                maxFee: document.getElementById('searchMaxFee').value
            };
            loadSpecialists(filters);
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('searchName').value = '';
            document.getElementById('searchExpertise').value = '';
            document.getElementById('searchLevel').value = '';
            document.getElementById('searchStatus').value = '';
            document.getElementById('searchMinFee').value = '';
            document.getElementById('searchMaxFee').value = '';
            loadSpecialists();
        });

        loadExpertiseOptions();
        loadSpecialists();
    </script>
</body>
</html>
