<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Specialist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; margin: 0; font-family: 'Fira Sans', Arial, sans-serif; }
        .sidebar { width: 240px; background: linear-gradient(180deg, #EFE8DE 0%, #E8DFD3 100%); color: #5C5C5C; padding: 28px 18px; border-right: 1px solid #DDD4C5; }
        .sidebar h2 { color: #3D3D3D; text-align: center; margin-bottom: 28px; font-size: 20px; font-weight: 700; border-bottom: 1px solid #DDD4C5; padding-bottom: 16px; }
        .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
        .sidebar nav a { color: #8B8378; text-decoration: none; padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; transition: all 0.25s ease; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #F0EBE3; color: #3D3D3D; border-left: none; }
        .sidebar nav a.active { background: #E8DFD3; font-weight: 600; }
        .main { flex: 1; background: #F7F5F2; padding: 36px 40px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 32px 36px; border-radius: 22px; box-shadow: 0 2px 12px rgba(0,0,0,0.03), 0 8px 32px rgba(0,0,0,0.03); }
        .search-bar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; align-items: flex-end; }
        .search-bar > div { display: flex; flex-direction: column; min-width: 100px; }
        .search-bar label { font-size: 11px; font-weight: 600; color: #A09888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .search-bar input, .search-bar select { padding: 10px 14px; border: 1.5px solid #EDE8E0; border-radius: 12px; font-family: inherit; font-size: 13px; background: #FAF8F5; color: #4A4A4A; }
        .search-bar button { padding: 10px 18px; border: none; border-radius: 40px; cursor: pointer; color: #fff; font-family: inherit; font-size: 13px; font-weight: 600; transition: all 0.25s ease; }
        .btn-search { background: #E8B4A2; }
        .btn-search:hover { background: #E0A18A; }
        .btn-clear { background: #A09888; }
        .btn-clear:hover { background: #8B8378; }
        .btn-save { background: #A5C9A5; }
        .btn-load { background: #E0C8A0; }
        .specialist-card { border: 1px solid #EDE8E0; padding: 20px 24px; margin-bottom: 12px; border-radius: 18px; background: #FAF8F5; display: flex; justify-content: space-between; align-items: center; transition: box-shadow 0.25s ease; }
        .specialist-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
        .specialist-card h3 { margin: 0 0 8px 0; color: #3D3D3D; }
        .specialist-card p { margin: 4px 0; color: #8B8378; font-size: 13px; }
        .badge-available { color: #3D6B35; font-weight: 600; }
        .badge-unavailable { color: #8A4040; font-weight: 600; }
        .view-btn { display: inline-block; padding: 8px 20px; background: #E8B4A2; color: #fff; text-decoration: none; border-radius: 40px; font-size: 13px; font-weight: 600; transition: all 0.25s ease; }
        .view-btn:hover { background: #E0A18A; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
        .pagination button { padding: 8px 14px; border: 1.5px solid #EDE8E0; background: #fff; cursor: pointer; border-radius: 12px; font-family: inherit; font-size: 13px; color: #5C5C5C; transition: all 0.25s ease; }
        .pagination button.active { background: #E8B4A2; color: #fff; border-color: #E8B4A2; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Expert Booking</h2>
        <nav>
            <a href="profile.html">My Profile</a>
            <a href="specialist-list.html" class="active">Find a Specialist</a>
            <a href="my-bookings.html">My Bookings</a>
            <a href="#" onclick="localStorage.clear();location.href='login.html'" style="margin-top:auto;border-top:1px solid #334155;padding-top:15px;margin-top:20px;">Logout</a>
        </nav>
    </aside>
    <main class="main">
        <div class="container">
            <h2 style="margin-top:0;">Find a Specialist</h2>
            <div class="search-bar">
                <div><label>Name</label><input type="text" id="searchName" placeholder="Search by name..."></div>
                <div><label>Expertise</label><select id="searchExpertise"><option value="">All</option></select></div>
                <div><label>Level</label><select id="searchLevel"><option value="">All</option><option value="Junior">Junior</option><option value="Intermediate">Intermediate</option><option value="Senior">Senior</option></select></div>
                <div><label>Status</label><select id="searchStatus"><option value="">All</option><option value="1">Available</option><option value="0">Unavailable</option></select></div>
                <div><label>Min Fee</label><input type="number" id="searchMinFee" placeholder="0" style="width:80px;"></div>
                <div><label>Max Fee</label><input type="number" id="searchMaxFee" placeholder="999" style="width:80px;"></div>
                <div><label>Date</label><input type="date" id="searchDate"></div>
                <div><label>Time From</label><input type="time" id="searchTimeFrom"></div>
                <div><label>Time To</label><input type="time" id="searchTimeTo"></div>
                <button class="btn-search" id="searchBtn">Search</button>
                <button class="btn-clear" id="clearBtn">Clear All</button>
                <button class="btn-save" id="savePrefBtn">Save</button>
                <button class="btn-load" id="loadPrefBtn">Load</button>
            </div>
            <div id="specialistList">Loading specialists...</div>
            <div class="pagination" id="pagination"></div>
        </div>
    </main>
    <script type="module">
        const API_BASE = '';
        let currentPage = 0, totalPages = 1, pageSize = 10;
        function getFilters() {
            return {
                name: document.getElementById('searchName').value.trim(),
                expertise: document.getElementById('searchExpertise').value,
                level: document.getElementById('searchLevel').value,
                status: document.getElementById('searchStatus').value,
                minFee: document.getElementById('searchMinFee').value,
                maxFee: document.getElementById('searchMaxFee').value,
                date: document.getElementById('searchDate').value,
                timeFrom: document.getElementById('searchTimeFrom').value,
                timeTo: document.getElementById('searchTimeTo').value
            };
        }
        async function loadSpecialists(page = 0) {
            const f = getFilters();
            const params = new URLSearchParams();
            if (f.name) params.append('name', f.name);
            if (f.expertise) params.append('expertise', f.expertise);
            if (f.level) params.append('level', f.level);
            if (f.status !== '') params.append('status', f.status);
            if (f.minFee) params.append('minFee', f.minFee);
            if (f.maxFee) params.append('maxFee', f.maxFee);
            if (f.date && f.timeFrom && f.timeTo) {
                params.append('availableFrom', `${f.date}T${f.timeFrom}:00`);
                params.append('availableTo', `${f.date}T${f.timeTo}:00`);
            }
            params.append('page', page);
            params.append('size', pageSize);
            try {
                const response = await fetch(`${API_BASE}/api/v1/specialists?${params.toString()}`);
                if (!response.ok) throw new Error('Failed to fetch specialists');
                const data = await response.json();
                const specialists = data.content || data;
                currentPage = data.currentPage || 0;
                totalPages = data.totalPages || 1;
                renderSpecialists(specialists);
                renderPagination(currentPage, totalPages);
            } catch (err) {
                document.getElementById('specialistList').innerHTML = '<p style="color:red;">Failed to load specialists.</p>';
            }
        }
        function renderSpecialists(list) {
            const container = document.getElementById('specialistList');
            if (!list || list.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#6b7280;">No specialists found.</p>';
                return;
            }
            container.innerHTML = list.map(s => {
                const statusText = s.statusText || (s.status === 1 ? 'Available' : 'Unavailable');
                return `
                    <div class="specialist-card">
                        <div>
                            <h3>${s.name}</h3>
                            <p>Expertise: ${s.expertise} | Level: ${s.level} | Fee: $${s.fee}/hour</p>
                            <p>Status: <span class="${s.status === 1 ? 'badge-available' : 'badge-unavailable'}">${statusText}</span></p>
                        </div>
                        <a href="specialist-details.html?id=${s.id}" class="view-btn">View & Book</a>
                    </div>
                `;
            }).join('');
        }
        function renderPagination(current, total) {
            const container = document.getElementById('pagination');
            if (total <= 1) { container.innerHTML = ''; return; }
            let html = `<button ${current === 0 ? 'disabled' : ''} onclick="goToPage(${current - 1})">← Prev</button>`;
            for (let i = 0; i < total; i++) {
                html += `<button class="${i === current ? 'active' : ''}" onclick="goToPage(${i})">${i + 1}</button>`;
            }
            html += `<button ${current >= total - 1 ? 'disabled' : ''} onclick="goToPage(${current + 1})">Next →</button>`;
            container.innerHTML = html;
        }
        window.goToPage = function(page) { loadSpecialists(page); };
        async function loadExpertiseOptions() {
            try {
                const resp = await fetch(`${API_BASE}/api/v1/expertise`);
                if (!resp.ok) return;
                const list = await resp.json();
                const select = document.getElementById('searchExpertise');
                list.forEach(exp => {
                    const opt = document.createElement('option');
                    opt.value = exp.expertiseName;
                    opt.textContent = exp.expertiseName;
                    select.appendChild(opt);
                });
            } catch (err) { console.error('Failed to load expertise:', err); }
        }
        document.getElementById('searchBtn').addEventListener('click', () => loadSpecialists(0));
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.querySelectorAll('.search-bar input, .search-bar select').forEach(el => el.value = '');
            loadSpecialists(0);
        });
        document.getElementById('savePrefBtn').addEventListener('click', () => {
            localStorage.setItem('searchPreferences', JSON.stringify(getFilters()));
            alert('Search preferences saved!');
        });
        document.getElementById('loadPrefBtn').addEventListener('click', () => {
            const stored = localStorage.getItem('searchPreferences');
            if (!stored) { alert('No saved preferences exist.'); return; }
            const prefs = JSON.parse(stored);
            document.getElementById('searchName').value = prefs.name || '';
            document.getElementById('searchExpertise').value = prefs.expertise || '';
            document.getElementById('searchLevel').value = prefs.level || '';
            document.getElementById('searchStatus').value = prefs.status || '';
            document.getElementById('searchMinFee').value = prefs.minFee || '';
            document.getElementById('searchMaxFee').value = prefs.maxFee || '';
            document.getElementById('searchDate').value = prefs.date || '';
            document.getElementById('searchTimeFrom').value = prefs.timeFrom || '';
            document.getElementById('searchTimeTo').value = prefs.timeTo || '';
            loadSpecialists(0);
        });
        loadExpertiseOptions();
        loadSpecialists(0);
    </script>
</body>
</html>
