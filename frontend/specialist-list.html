<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Specialist</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .search-bar > div {
            display: flex;
            flex-direction: column;
            min-width: 100px;
        }
        .search-bar label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 2px;
        }
        .search-bar input, .search-bar select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            flex: 1;
        }
        .search-bar button {
            padding: 8px 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            height: 38px;
        }
        .search-bar button.clear-btn {
            background: #6c757d;
        }
        .search-bar button.save-btn {
            background: #17a2b8;
        }
        .search-bar button.load-btn {
            background: #28a745;
        }
        .specialist-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #fafafa;
        }
        .specialist-card h3 { margin: 0 0 10px 0; }
        .specialist-card p { margin: 5px 0; }
        .badge-available { color: green; font-weight: bold; }
        .badge-unavailable { color: red; font-weight: bold; }
        .view-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .pagination button.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .pagination span {
            padding: 6px 8px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Find a Specialist</h2>
        <div class="search-bar">
            <div>
                <label>Name</label>
                <input type="text" id="searchName" placeholder="Search by name...">
            </div>
            <div>
                <label>Expertise</label>
                <select id="searchExpertise"><option value="">All</option></select>
            </div>
            <div>
                <label>Level</label>
                <select id="searchLevel">
                    <option value="">All</option>
                    <option value="Junior">Junior</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Senior">Senior</option>
                </select>
            </div>
            <div>
                <label>Status</label>
                <select id="searchStatus">
                    <option value="">All</option>
                    <option value="1">Available</option>
                    <option value="0">Unavailable</option>
                </select>
            </div>
            <div>
                <label>Min Fee</label>
                <input type="number" id="searchMinFee" placeholder="0" min="0" style="width:80px;">
            </div>
            <div>
                <label>Max Fee</label>
                <input type="number" id="searchMaxFee" placeholder="999" min="0" style="width:80px;">
            </div>
            <div>
                <label>Date</label>
                <input type="date" id="searchDate">
            </div>
            <div>
                <label>Time From</label>
                <input type="time" id="searchTimeFrom" step="1800">
            </div>
            <div>
                <label>Time To</label>
                <input type="time" id="searchTimeTo" step="1800">
            </div>
            <button id="searchBtn">Search</button>
            <button id="clearBtn" class="clear-btn">Clear All</button>
            <button id="savePrefBtn" class="save-btn">Save</button>
            <button id="loadPrefBtn" class="load-btn">Load</button>
        </div>
        <div id="specialistList">Loading specialists...</div>
        <div class="pagination" id="pagination"></div>
    </div>

    <script type="module">
        const API_BASE = 'http://121.196.221.244:8080';
        let currentPage = 0;
        let totalPages = 1;
        const pageSize = 10;

        function getFilters() {
            return {
                name: document.getElementById('searchName').value.trim(),
                expertise: document.getElementById('searchExpertise').value,
                level: document.getElementById('searchLevel').value,
                status: document.getElementById('searchStatus').value,
                minFee: document.getElementById('searchMinFee').value,
                maxFee: document.getElementById('searchMaxFee').value,
                date: document.getElementById('searchDate').value,
                timeFrom: document.getElementById('searchTimeFrom').value,
                timeTo: document.getElementById('searchTimeTo').value
            };
        }

        async function loadSpecialists(page = 0) {
            const f = getFilters();
            const params = new URLSearchParams();
            if (f.name) params.append('name', f.name);
            if (f.expertise) params.append('expertise', f.expertise);
            if (f.level) params.append('level', f.level);
            if (f.status !== '') params.append('status', f.status);
            if (f.minFee) params.append('minFee', f.minFee);
            if (f.maxFee) params.append('maxFee', f.maxFee);
            if (f.date && f.timeFrom && f.timeTo) {
                params.append('availableFrom', `${f.date}T${f.timeFrom}:00`);
                params.append('availableTo', `${f.date}T${f.timeTo}:00`);
            }
            params.append('page', page);
            params.append('size', pageSize);

            try {
                const response = await fetch(`${API_BASE}/api/v1/specialists?${params.toString()}`);
                if (!response.ok) throw new Error('Failed to fetch specialists');
                const data = await response.json();
                const specialists = data.content || data;
                currentPage = data.currentPage || 0;
                totalPages = data.totalPages || 1;
                renderSpecialists(specialists);
                renderPagination(currentPage, totalPages);
            } catch (err) {
                document.getElementById('specialistList').innerHTML = `<p class="error">Failed to load: ${err.message}</p>`;
            }
        }

        function renderSpecialists(list) {
            const container = document.getElementById('specialistList');
            if (!list || list.length === 0) {
                container.innerHTML = '<p>No specialists found.</p>';
                return;
            }
            container.innerHTML = list.map(s => {
                const statusText = s.statusText || (s.status === 1 ? 'Available' : 'Unavailable');
                const statusClass = s.status === 1 ? 'badge-available' : 'badge-unavailable';
                return `
                    <div class="specialist-card">
                        <h3>${s.name}</h3>
                        <p><strong>Expertise:</strong> ${s.expertise}</p>
                        <p><strong>Level:</strong> ${s.level}</p>
                        <p><strong>Fee:</strong> $${s.fee}/hour</p>
                        <p><strong>Status:</strong> <span class="${statusClass}">${statusText}</span></p>
                        <a href="specialist-details.html?id=${s.id}" class="view-btn">View & Book</a>
                    </div>
                `;
            }).join('');
        }

        function renderPagination(current, total) {
            const container = document.getElementById('pagination');
            if (total <= 1) { container.innerHTML = ''; return; }
            let html = '';
            html += `<button ${current === 0 ? 'disabled' : ''} onclick="goToPage(${current - 1})">← Prev</button>`;
            for (let i = 0; i < total; i++) {
                html += `<button class="${i === current ? 'active' : ''}" onclick="goToPage(${i})">${i + 1}</button>`;
            }
            html += `<button ${current >= total - 1 ? 'disabled' : ''} onclick="goToPage(${current + 1})">Next →</button>`;
            html += `<span>Page ${current + 1} of ${total}</span>`;
            container.innerHTML = html;
        }

        window.goToPage = function(page) {
            loadSpecialists(page);
        };

        async function loadExpertiseOptions() {
            try {
                const resp = await fetch(`${API_BASE}/api/v1/expertise`);
                if (!resp.ok) return;
                const list = await resp.json();
                const select = document.getElementById('searchExpertise');
                list.forEach(exp => {
                    const opt = document.createElement('option');
                    opt.value = exp.expertiseName;
                    opt.textContent = exp.expertiseName;
                    select.appendChild(opt);
                });
            } catch (err) { console.error('Failed to load expertise:', err); }
        }

        // 搜索按钮
        document.getElementById('searchBtn').addEventListener('click', () => loadSpecialists(0));
        // 清除按钮
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('searchName').value = '';
            document.getElementById('searchExpertise').value = '';
            document.getElementById('searchLevel').value = '';
            document.getElementById('searchStatus').value = '';
            document.getElementById('searchMinFee').value = '';
            document.getElementById('searchMaxFee').value = '';
            document.getElementById('searchDate').value = '';
            document.getElementById('searchTimeFrom').value = '';
            document.getElementById('searchTimeTo').value = '';
            loadSpecialists(0);
        });
        // 保存偏好
        document.getElementById('savePrefBtn').addEventListener('click', () => {
            const prefs = getFilters();
            localStorage.setItem('searchPreferences', JSON.stringify(prefs));
            alert('Search preferences saved!');
        });
        // 加载偏好
        document.getElementById('loadPrefBtn').addEventListener('click', () => {
            const stored = localStorage.getItem('searchPreferences');
            if (!stored) { alert('No saved preferences exist.'); return; }
            const prefs = JSON.parse(stored);
            document.getElementById('searchName').value = prefs.name || '';
            document.getElementById('searchExpertise').value = prefs.expertise || '';
            document.getElementById('searchLevel').value = prefs.level || '';
            document.getElementById('searchStatus').value = prefs.status || '';
            document.getElementById('searchMinFee').value = prefs.minFee || '';
            document.getElementById('searchMaxFee').value = prefs.maxFee || '';
            document.getElementById('searchDate').value = prefs.date || '';
            document.getElementById('searchTimeFrom').value = prefs.timeFrom || '';
            document.getElementById('searchTimeTo').value = prefs.timeTo || '';
            loadSpecialists(0);
        });

        loadExpertiseOptions();
        loadSpecialists(0);
    </script>
</body>
</html>
