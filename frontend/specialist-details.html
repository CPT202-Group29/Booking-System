<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Specialist Details - Expert Booking System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fira Sans', Arial, sans-serif; display: flex; min-height: 100vh; }
        .sidebar {
            width: 240px; background: linear-gradient(180deg, #EFE8DE 0%, #E8DFD3 100%); color: #5C5C5C; padding: 28px 18px;
            display: flex; flex-direction: column; border-right: 1px solid #DDD4C5;
        }
        .sidebar h2 { color: #3D3D3D; text-align: center; margin-bottom: 28px; font-size: 20px; font-weight: 700; border-bottom: 1px solid #DDD4C5; padding-bottom: 16px; }
        .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
        .sidebar nav a { color: #8B8378; text-decoration: none; padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; transition: all 0.25s ease; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #F0EBE3; color: #3D3D3D; border-left: none; }
        .sidebar nav a.active { background: #E8DFD3; font-weight: 600; }
        .main { flex: 1; background: #F7F5F2; padding: 36px 40px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 32px 36px; border-radius: 22px; box-shadow: 0 2px 12px rgba(0,0,0,0.03), 0 8px 32px rgba(0,0,0,0.03); }
        .expert-card { border: 1px solid #EDE8E0; padding: 24px; border-radius: 18px; margin-bottom: 24px; background: #FAF8F5; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #8B8378; }
        input, select, textarea {
            width: 100%; padding: 12px 16px; border: 1.5px solid #EDE8E0; border-radius: 14px; font-size: 14px;
            font-family: inherit; background: #FAF8F5; color: #4A4A4A; transition: border-color 0.25s ease;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #D4C4B0; box-shadow: 0 0 0 4px rgba(200,180,155,0.12); }
        button {
            background: #E8B4A2; color: #fff; border: none; padding: 12px 24px; border-radius: 40px;
            cursor: pointer; width: 100%; font-size: 14px; font-weight: 600; font-family: inherit;
            transition: all 0.25s ease;
        }
        button:hover { background: #E0A18A; }
        .fee-info { background: #F5F0EB; padding: 12px 16px; border-radius: 14px; margin: 12px 0; font-weight: 600; color: #3D3D3D; }
        .error { color: #8A4040; }
        .success { color: #3D6B35; }
        .back-btn { display: inline-block; margin-top: 16px; color: #C4A88B; text-decoration: none; font-weight: 500; }
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); justify-content: center; align-items: center; z-index:1000; }
        .modal-content { background: #fff; padding: 28px; border-radius: 22px; max-width: 450px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,0.1); }
        .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
        .modal-actions button { flex: 1; }
        .btn-confirm { background: #A5C9A5; color: #fff; }
        .btn-confirm:hover { background: #90B890; }
        .btn-cancel { background: #A09888; color: #fff; }
        .btn-cancel:hover { background: #8B8378; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Expert Booking</h2>
        <nav>
            <a href="profile.html">My Profile</a>
            <a href="specialist-list.html" class="active">Find a Specialist</a>
            <a href="my-bookings.html">My Bookings</a>
            <a href="#" onclick="localStorage.clear();location.href='login.html'" style="margin-top:auto;border-top:1px solid #334155;padding-top:15px;margin-top:20px;">Logout</a>
        </nav>
    </aside>

    <main class="main">
        <div class="container">
            <h2 style="margin-top:0;">Specialist Details</h2>
            <div id="expertInfo">Loading...</div>
            <form id="bookingForm" style="display:none;">
                <div class="fee-info" id="feeDisplay">Calculating fee...</div>
                <div class="form-group"><label>Date</label><input type="date" id="date" required></div>
                <div class="form-group"><label>Time Slot</label><select id="timeSlot" required><option value="">Select date first</option></select></div>
                <div class="form-group"><label>Topic (required)</label><textarea id="topic" rows="2" required></textarea></div>
                <div class="form-group"><label>Notes (optional)</label><textarea id="notes" rows="2" placeholder="Any specific concerns..."></textarea></div>
                <button type="submit">Book Appointment</button>
            </form>
            <div id="message"></div>
            <a href="specialist-list.html" class="back-btn">← Back to Specialists</a>
        </div>
    </main>

    <!-- 确认模态框 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <h3>📋 Booking Summary</h3>
            <table>
                <tr><td>Specialist</td><td id="summarySpecialist"></td></tr>
                <tr><td>Date</td><td id="summaryDate"></td></tr>
                <tr><td>Time</td><td id="summaryTime"></td></tr>
                <tr><td>Fee</td><td id="summaryFee"></td></tr>
                <tr><td>Topic</td><td id="summaryTopic"></td></tr>
                <tr><td>Notes</td><td id="summaryNotes"></td></tr>
            </table>
            <div class="modal-actions">
                <button class="btn-confirm" id="confirmSubmitBtn">Confirm Booking</button>
                <button class="btn-cancel" id="cancelSubmitBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/api.js">
        // 直接在下方内联脚本，避免模块路径问题
    </script>
    <!-- 内联脚本，因为之前的模块导入路径可能有问题，这里直接复制 specialist-details 的脚本内容 -->
    <script type="module">
        import { getSpecialistById, getAvailableSlots, createBooking, getBookingFee } from './js/api.js';

        const urlParams = new URLSearchParams(window.location.search);
        const expertId = urlParams.get('id');
        if (!expertId) {
            document.getElementById('expertInfo').innerHTML = '<p class="error">No specialist specified.</p>';
            throw new Error('Missing expert id');
        }

        let expert = null;
        let currentFee = null;

        async function loadExpert() {
            try {
                expert = await getSpecialistById(expertId);
                const statusText = expert.statusText || (expert.status === 1 ? 'Available' : 'Unavailable');
                document.getElementById('expertInfo').innerHTML = `
                    <div class="expert-card">
                        <h3>${expert.name}</h3>
                        <p><strong>Expertise:</strong> ${expert.expertise}</p>
                        <p><strong>Level:</strong> ${expert.level}</p>
                        <p><strong>Fee:</strong> $${expert.fee}/hour</p>
                        <p><strong>Status:</strong> ${statusText}</p>
                        <p><strong>Contact:</strong> ${expert.contact || 'N/A'}</p>
                        <p><strong>Description:</strong> ${expert.description || 'N/A'}</p>
                    </div>
                `;
                document.getElementById('bookingForm').style.display = 'block';
                currentFee = await getBookingFee(expertId);
                document.getElementById('feeDisplay').innerHTML = `Consultation Fee: <strong>$${currentFee}</strong>`;
            } catch (err) {
                document.getElementById('expertInfo').innerHTML = `<p class="error">Failed to load expert: ${err.message}</p>`;
            }
        }

        const dateInput = document.getElementById('date');
        const timeSlotSelect = document.getElementById('timeSlot');
        dateInput.min = new Date().toISOString().split('T')[0];

        dateInput.addEventListener('change', async () => {
            const date = dateInput.value;
            if (!date) return;
            try {
                const slots = await getAvailableSlots(expertId, date);
                timeSlotSelect.innerHTML = '<option value="">Select time slot</option>';
                slots.forEach(slot => {
                    const option = document.createElement('option');
                    option.value = slot.id;
                    const start = slot.startTime ? new Date(slot.startTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
                    const end = slot.endTime ? new Date(slot.endTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
                    option.textContent = `${start} - ${end}`;
                    timeSlotSelect.appendChild(option);
                });
            } catch (err) {
                timeSlotSelect.innerHTML = '<option>Failed to load slots</option>';
            }
        });

        document.getElementById('bookingForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const timeSlotId = timeSlotSelect.value;
            const topic = document.getElementById('topic').value.trim();
            const notes = document.getElementById('notes').value.trim();
            if (!timeSlotId || !topic) { alert('Please fill all required fields'); return; }
            document.getElementById('summarySpecialist').textContent = expert.name;
            document.getElementById('summaryDate').textContent = dateInput.value;
            document.getElementById('summaryTime').textContent = timeSlotSelect.options[timeSlotSelect.selectedIndex].textContent;
            document.getElementById('summaryFee').textContent = '$' + currentFee;
            document.getElementById('summaryTopic').textContent = topic;
            document.getElementById('summaryNotes').textContent = notes || '-';
            document.getElementById('confirmModal').style.display = 'flex';
        });

        document.getElementById('confirmSubmitBtn').addEventListener('click', async () => {
            document.getElementById('confirmModal').style.display = 'none';
            const timeSlotId = timeSlotSelect.value;
            const topic = document.getElementById('topic').value.trim();
            const notes = document.getElementById('notes').value.trim();
            try {
                const booking = await createBooking(parseInt(expertId), parseInt(timeSlotId), topic, notes);
                document.getElementById('message').innerHTML = `<div class="success">Booking created! Status: PENDING, Fee: $${booking.chargeAmount || currentFee}</div>`;
                setTimeout(() => window.location.href = 'my-bookings.html', 1500);
            } catch (err) {
                document.getElementById('message').innerHTML = `<div class="error">${err.message}</div>`;
            }
        });

        document.getElementById('cancelSubmitBtn').addEventListener('click', () => {
            document.getElementById('confirmModal').style.display = 'none';
        });

        loadExpert();
    </script>
</body>
</html>
