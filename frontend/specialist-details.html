<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Specialist Details</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .expert-card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px; cursor: pointer; width: 100%; }
        .error { color: red; }
        .success { color: green; }
        .back-btn { display: inline-block; margin-top: 20px; }
        .fee-info { background: #e8f5e9; padding: 10px; border-radius: 4px; margin: 10px 0; font-weight: bold; }

        /* 模态框样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-top: 0; }
        .modal-content table { width: 100%; margin: 15px 0; border-collapse: collapse; }
        .modal-content table td { padding: 8px 0; border-bottom: 1px solid #eee; }
        .modal-content table td:first-child { font-weight: bold; width: 40%; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; }
        .btn-confirm { background: #28a745; }
        .btn-cancel { background: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Specialist Details</h2>
        <div id="expertInfo">Loading...</div>
        <form id="bookingForm" style="display:none;">
            <div class="fee-info" id="feeDisplay">Calculating fee...</div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>Time Slot</label>
                <select id="timeSlot" required>
                    <option value="">Select date first</option>
                </select>
            </div>
            <div class="form-group">
                <label>Topic (required)</label>
                <textarea id="topic" rows="2" required></textarea>
            </div>
            <div class="form-group">
                <label>Notes (optional)</label>
                <textarea id="notes" rows="3" placeholder="Any specific concerns..."></textarea>
            </div>
            <button type="submit">Book Appointment</button>
        </form>
        <div id="message"></div>
        <a href="specialist-list.html" class="back-btn">← Back to Specialists</a>
    </div>

    <!-- 确认摘要模态框 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <h3>📋 Booking Summary</h3>
            <table>
                <tr><td>Specialist</td><td id="summarySpecialist"></td></tr>
                <tr><td>Date</td><td id="summaryDate"></td></tr>
                <tr><td>Time</td><td id="summaryTime"></td></tr>
                <tr><td>Fee</td><td id="summaryFee"></td></tr>
                <tr><td>Topic</td><td id="summaryTopic"></td></tr>
                <tr><td>Notes</td><td id="summaryNotes"></td></tr>
            </table>
            <div class="modal-actions">
                <button class="btn-confirm" id="confirmSubmitBtn">Confirm Booking</button>
                <button class="btn-cancel" id="cancelSubmitBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getSpecialistById, getAvailableSlots, createBooking, getBookingFee } from './js/api.js';

        const urlParams = new URLSearchParams(window.location.search);
        const expertId = urlParams.get('id');
        if (!expertId) {
            document.getElementById('expertInfo').innerHTML = '<p class="error">No specialist specified.</p>';
            throw new Error('Missing expert id');
        }

        let expert = null;
        let currentFee = null; // 存储当前预估费用

        async function loadExpert() {
            try {
                expert = await getSpecialistById(expertId);
                const statusText = expert.statusText || (expert.status === 1 ? 'Available' : 'Unavailable');
                document.getElementById('expertInfo').innerHTML = `
                    <div class="expert-card">
                        <h3>${expert.name}</h3>
                        <p><strong>Expertise:</strong> ${expert.expertise}</p>
                        <p><strong>Level:</strong> ${expert.level}</p>
                        <p><strong>Fee:</strong> $${expert.fee}/hour</p>
                        <p><strong>Status:</strong> ${statusText}</p>
                        <p><strong>Contact:</strong> ${expert.contact || 'N/A'}</p>
                        <p><strong>Description:</strong> ${expert.description || 'N/A'}</p>
                    </div>
                `;
                document.getElementById('bookingForm').style.display = 'block';

                // 获取并显示预估费用
                currentFee = await getBookingFee(expertId);
                document.getElementById('feeDisplay').innerHTML = `Consultation Fee: <strong>$${currentFee}</strong> (based on specialist level)`;
            } catch (err) {
                document.getElementById('expertInfo').innerHTML = `<p class="error">Failed to load expert: ${err.message}</p>`;
            }
        }

        const dateInput = document.getElementById('date');
        const timeSlotSelect = document.getElementById('timeSlot');
        dateInput.min = new Date().toISOString().split('T')[0];

        dateInput.addEventListener('change', async () => {
            const date = dateInput.value;
            if (!date) return;
            try {
                const slots = await getAvailableSlots(expertId, date);
                timeSlotSelect.innerHTML = '<option value="">Select time slot</option>';
                slots.forEach(slot => {
                    const option = document.createElement('option');
                    option.value = slot.id;
                    const startTime = slot.startTime ? new Date(slot.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                    const endTime = slot.endTime ? new Date(slot.endTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                    option.textContent = `${startTime} - ${endTime}`;
                    timeSlotSelect.appendChild(option);
                });
            } catch (err) {
                timeSlotSelect.innerHTML = '<option>Failed to load slots</option>';
            }
        });

        // 提交事件改为弹出确认摘要
        document.getElementById('bookingForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const timeSlotId = timeSlotSelect.value;
            const topic = document.getElementById('topic').value.trim();
            const notes = document.getElementById('notes').value.trim();
            if (!timeSlotId || !topic) {
                alert('Please fill all required fields');
                return;
            }

            // 填充摘要信息
            document.getElementById('summarySpecialist').textContent = expert.name;
            document.getElementById('summaryDate').textContent = dateInput.value;
            document.getElementById('summaryTime').textContent = timeSlotSelect.options[timeSlotSelect.selectedIndex].textContent;
            document.getElementById('summaryFee').textContent = '$' + currentFee;
            document.getElementById('summaryTopic').textContent = topic;
            document.getElementById('summaryNotes').textContent = notes || '-';

            // 显示模态框
            document.getElementById('confirmModal').style.display = 'flex';
        });

        // 确认按钮：真正提交预约
        document.getElementById('confirmSubmitBtn').addEventListener('click', async () => {
            document.getElementById('confirmModal').style.display = 'none';
            const timeSlotId = timeSlotSelect.value;
            const topic = document.getElementById('topic').value.trim();
            const notes = document.getElementById('notes').value.trim();
            try {
                const booking = await createBooking(parseInt(expertId), parseInt(timeSlotId), topic, notes);
                document.getElementById('message').innerHTML = `<div class="success">Booking created! Status: PENDING, Fee: $${booking.chargeAmount || currentFee}</div>`;
                setTimeout(() => window.location.href = 'my-bookings.html', 1500);
            } catch (err) {
                document.getElementById('message').innerHTML = `<div class="error">${err.message}</div>`;
            }
        });

        // 取消按钮：关闭模态框
        document.getElementById('cancelSubmitBtn').addEventListener('click', () => {
            document.getElementById('confirmModal').style.display = 'none';
        });

        loadExpert();
    </script>
</body>
</html>
