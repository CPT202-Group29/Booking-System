spring.application.name=booking-system
# 1. 告诉系统我们要连本机的 MySQL 数据库（名字叫 cpt202_booking）
spring.datasource.url=jdbc:mysql://localhost:3306/cpt202_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# ⚠️ 注意：把下面这行的 123456 换成你刚才安装 MySQL 时设置的 root 密码！
spring.datasource.password=123456

# 2. 告诉系统使用 MySQL 驱动
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. 在控制台打印出后台运行的 SQL 语句，方便我们小白找 bug
spring.jpa.show-sql=true
# 4. 保持数据库表结构和代码同步
spring.jpa.hibernate.ddl-auto=update