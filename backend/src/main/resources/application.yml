server:
  port: 8080

spring:
  application:
    name: booking-system

  # Default: H2 in-memory for local dev (no external DB needed)
  # Switch to MySQL with: --spring.profiles.active=mysql
  datasource:
    url: jdbc:h2:mem:bookingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# --- MySQL profile (Aliyun) ---
# Activate with: --spring.profiles.active=mysql
# Or set SPRING_PROFILES_ACTIVE=mysql environment variable
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://47.111.224.168:3306/expert_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: expert
    password: 123456Abc
  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
